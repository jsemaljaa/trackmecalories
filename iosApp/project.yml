# The iOS app: a thin SwiftUI shell around the shared Compose UI (shared/, framework "Shared").
# Generate the Xcode project with XcodeGen (`brew install xcodegen`, then `xcodegen` in this
# folder); CI does that in .github/workflows/ios.yml. The .xcodeproj itself isn't committed.
name: TrackMeCalories
options:
  bundleIdPrefix: com.jsemalja
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    # Keep in step with versionName / versionCode in app/build.gradle.kts.
    MARKETING_VERSION: "2.2"
    CURRENT_PROJECT_VERSION: "13"
targets:
  TrackMeCalories:
    type: application
    platform: iOS
    sources:
      - path: TrackMeCalories
      # Bundled food lists, shared with the Android app; read from <bundle>/assets.
      - path: ../app/src/main/assets
        type: folder
        buildPhase: resources
    info:
      path: TrackMeCalories/Info.plist
      properties:
        CFBundleDisplayName: TrackMe Calories
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Lets iOS offer English/Russian in Settings → TrackMe Calories → Language.
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose Multiplatform needs this for 120 Hz rendering on ProMotion screens.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Scans food barcodes so you don't have to type them in.
        NSHealthShareUsageDescription: Shows your steps, active calories and workouts next to what you ate.
        NSHealthUpdateUsageDescription: TrackMe Calories doesn't write to Apple Health.
    entitlements:
      path: TrackMeCalories/TrackMeCalories.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsemalja.trackmecalories
        TARGETED_DEVICE_FAMILY: "1"
        # The Gradle build phase writes outside the sandboxed paths.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # The Kotlin framework is static, so the system frameworks it uses are linked here.
        OTHER_LDFLAGS: -framework Shared -framework HealthKit -framework AVFoundation -framework UserNotifications
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
