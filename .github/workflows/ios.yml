# Builds the iOS app on a GitHub macOS runner and packages it as an .ipa for SideStore/AltStore,
# which sign it with the user's own Apple ID. The .ipa is only ad-hoc signed here (that carries
# the HealthKit entitlement through to SideStore's re-signing); it won't install as-is.
#
# Every run uploads the .ipa as a workflow artifact; pushing a tag like v2.2 also attaches it
# to a GitHub Release.
name: iOS build

on:
  push:
    branches: [main, feature/kmp-shared]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native's compilers and the iOS dependencies (~1 GB) are downloaded on first use.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/TrackMeCalories.xcodeproj -target TrackMeCalories \
            -configuration Release -sdk iphoneos SYMROOT="$PWD/iosApp/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log

      # The first compiler errors as one annotation, readable on the run page without opening the log.
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |error:|\* What went wrong|^> ' build.log | grep -v '^> Task' | head -60 \
            | sed -e 's#file://[^ ]*/trackmecalories/##' > errors.txt || true
          echo "::error title=Build errors::$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g' errors.txt)"

      - name: Package the .ipa
        run: |
          mkdir -p dist/Payload
          cp -R iosApp/build/Release-iphoneos/TrackMeCalories.app dist/Payload/
          codesign --force --sign - --entitlements iosApp/TrackMeCalories/TrackMeCalories.entitlements dist/Payload/TrackMeCalories.app
          cd dist && zip -qry TrackMeCalories.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: TrackMeCalories-ipa
          path: dist/TrackMeCalories.ipa

      # Launches a debug build in an iPhone simulator: reports whether it's still running after
      # 25 s and the end of its console output (as annotations), and keeps a screenshot.
      - name: Smoke test in the simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/TrackMeCalories.xcodeproj -target TrackMeCalories \
            -configuration Debug -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SYMROOT="$PWD/iosApp/build" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -3
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" iosApp/build/Debug-iphonesimulator/TrackMeCalories.app
          xcrun simctl launch --console-pty "$UDID" com.jsemalja.trackmecalories > app.log 2>&1 &
          sleep 25
          xcrun simctl io "$UDID" screenshot smoke.png
          log=$(tail -40 app.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')
          # (No ':' or ',' in titles: they'd end the annotation's properties.)
          if xcrun simctl spawn "$UDID" launchctl list | grep -q 'com.jsemalja.trackmecalories'; then
            echo "::notice title=Simulator - running after 25 s::$log"
          else
            echo "::error title=Simulator - app not running::$log"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulator-screenshot
          path: smoke.png
          if-no-files-found: ignore

      - name: SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 iosApp/make_source.py "$GITHUB_REF_NAME" dist/TrackMeCalories.ipa > dist/source.json

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/TrackMeCalories.ipa
            dist/source.json
